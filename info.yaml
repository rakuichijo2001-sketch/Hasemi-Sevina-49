# Tiny Tapeout project information
project:
  title:        "Hasemi-Sevina-49 Edge Risk Processor"
  author:       "CTW-SEVINA / Hasemi team"
  discord:      ""
  description:  "Configurable multi-sensor edge risk processor for slope-monitoring field nodes"
  language:     "Verilog"
  clock_hz:     10000000
  tiles:        "3x2"
  top_module:   "tt_um_rakuichijo2001_hasemi_sevina_49"

  source_files:
    - "project.v"
    - "spi_slave.v"
    - "register_bank.v"
    - "sensor_validator.v"
    - "risk_engine.v"
    - "risk_fsm.v"
    - "event_logger.v"

pinout:
  ui[0]: "SPI_SCLK"
  ui[1]: "SPI_MOSI"
  ui[2]: "SPI_CS_N"
  ui[3]: "TICK_1HZ"
  ui[4]: "EXT_FAULT"
  ui[5]: "RESERVED_MODE0"
  ui[6]: "RESERVED_MODE1"
  ui[7]: "RESERVED"

  uo[0]: "SPI_MISO"
  uo[1]: "ALERT"
  uo[2]: "CRITICAL"
  uo[3]: "SENSOR_FAULT"
  uo[4]: "WATCH"
  uo[5]: "WARNING"
  uo[6]: "HEARTBEAT"
  uo[7]: "IRQ"

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
