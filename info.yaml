# Tiny Tapeout project information
project:
  title:        "Hasemi-Sevina-49 Edge Risk Processor"
  author:       "CTW-SEVINA / Hasemi team"
  discord:      ""
  description:  "Multi-sensor risk accelerator with a minimal TinyQV-derived RISC-V control subsystem"
  language:     "Verilog"
  clock_hz:     10000000
  tiles:        "4x2"
  top_module:   "tt_um_rakuichijo2001_hasemi_sevina_49"

  source_files:
    - "project.v"
    - "spi_slave.v"
    - "mmio_bridge.v"
    - "register_bank.v"
    - "sensor_validator.v"
    - "risk_engine.v"
    - "risk_fsm.v"
    - "event_logger.v"
    - "cpu/tinyqv/tinyqv.v"
    - "cpu/tinyqv/cpu.v"
    - "cpu/tinyqv/core.v"
    - "cpu/tinyqv/decode.v"
    - "cpu/tinyqv/alu.v"
    - "cpu/tinyqv/register.v"
    - "cpu/tinyqv/counter.v"
    - "cpu/tinyqv/mem_ctrl.v"
    - "cpu/tinyqv/qspi_ctrl.v"

pinout:
  ui[0]: "SPI_SCLK"
  ui[1]: "SPI_MOSI"
  ui[2]: "SPI_CS_N"
  ui[3]: "TICK_1HZ"
  ui[4]: "EXT_FAULT"
  ui[5]: "RESERVED_MODE0"
  ui[6]: "RESERVED_MODE1"
  ui[7]: "RESERVED"

  uo[0]: "SPI_MISO"
  uo[1]: "ALERT"
  uo[2]: "CRITICAL"
  uo[3]: "SENSOR_FAULT"
  uo[4]: "WATCH"
  uo[5]: "WARNING"
  uo[6]: "HEARTBEAT"
  uo[7]: "IRQ"

  uio[0]: "QSPI_FLASH_CS_N"
  uio[1]: "QSPI_SD0"
  uio[2]: "QSPI_SD1"
  uio[3]: "QSPI_SCK"
  uio[4]: "QSPI_SD2"
  uio[5]: "QSPI_SD3"
  uio[6]: "QSPI_PSRAM_A_CS_N"
  uio[7]: "QSPI_PSRAM_B_CS_N"

yaml_version: 6
